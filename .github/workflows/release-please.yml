name: release-please

# Release automation (CI-14). Triggered DIRECTLY by a push to the protected
# branch. The previous `workflow_run` indirection on the CI workflow, gated on
# `conclusion == 'success'`, was removed in the SAME commit that dropped the
# protected branch from `ci.yml`'s push trigger — the two changes ship together
# or the release chain stops SILENTLY, with nothing red. That indirection also
# carried its own failure: a CANCELLED CI run on the protected branch fired
# `workflow_run` with `conclusion: cancelled`, the gate read false, and the
# release simply never happened — and the two-rapid-pushes shape of a release
# cycle is exactly what triggered it (DESIGN-DECISIONS entry 35 / Phase 12
# D-05). The redundancy the old gate bought is now bought by
# `strict_required_status_checks_policy: true` on the protected branch, which
# forces a pull request up to date before merge so the merged tree is the tree
# CI already tested. Recorded 2026-07-29, Phase 13 plan 13-04.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json

      - name: Tag major and minor versions
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Clean up old tags if they exist
          git tag -d v${{ steps.release.outputs.major }} || true
          git tag -d v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true
          git push origin :refs/tags/v${{ steps.release.outputs.major }} || true
          git push origin :refs/tags/v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} || true

          # Create and push new tags
          git tag -a v${{ steps.release.outputs.major }} -m "Release v${{ steps.release.outputs.major }}"
          git tag -a v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }} -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push origin v${{ steps.release.outputs.major }}
          git push origin v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
