name: Classify changed paths
description: >
  Decide whether this run may take the release-artifact fast path (CI-11). Emits
  `release-artifacts-only` = 'true' ONLY when every changed path is in the
  measured allowlist. FAILS SAFE — a non-pull-request event, a failed API call,
  an empty or truncated file list, or any unrecognised path all yield 'false',
  which means "run everything". The caller MUST run `actions/checkout` BEFORE
  invoking this composite — GitHub needs the repo on the runner filesystem to
  find this action.yml — and the caller MUST grant the job
  `pull-requests: read`, which is the only permission the changed-path read
  needs. Decided in the pchandler workspace
  .planning/phases/13-release-flow-apply-both-repos-symmetric/13-CONTEXT.md
  D-05 (fail-safe allowlist), D-06 (fast-path depth) and D-07 (why the
  classification is a composite and not an upstream job feeding `needs:`).
  When the answer cannot be determined, the failing call's own error text is
  preserved in the emitted reason and a warning annotation naming the runner is
  raised, so the inert state is visible on the run summary instead of buried in
  a step nobody opens — gap-closure decision D-A, taken after this classifier
  sat inert on the self-hosted runner gseg-pc105 for two sessions because that
  error text was discarded.
  Both repositories carry a copy of this file, and the two are maintained as a
  PAIRED CHANGE: edit both together and land them in one coordinated change
  (Phase 13 premise correction PC-3 — cross-repo symmetry is a phase-landing
  property, not a standing invariant). A difference between the copies therefore
  means an incomplete paired change, not a policy violation, and the copies may
  diverge here deliberately in future. No automated check covers this directory:
  audit_release_flow.py's TWIN_SUBJECTS are workflows / rulesets / scripts and
  exclude .github/actions/, so the pairing is a human discipline — which is
  consistent with D-12's "nothing standing", not a gap in it.

outputs:
  release-artifacts-only:
    description: "'true' when every changed path is a release artifact; 'false' otherwise (run everything)."
    value: ${{ steps.classify.outputs.release-artifacts-only }}

runs:
  using: composite
  steps:
    - id: classify
      name: Classify changed paths (CI-11 D-05)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Deliberately NO errexit here, only nounset + pipefail: an abort would
        # FAIL the job, but the fail-safe direction for a fast path is "run
        # everything", not "break the build". Same shell options, chosen for the
        # same reason, as canary.yml's detection step.
        set -uo pipefail

        # D-05 allowlist -- MEASURED, not assumed. `gh pr diff 34 --repo
        # gseg-ethz/GSEGUtils --name-only` on 2026-07-29 returned exactly three
        # paths: the changelog, the release-please manifest, and the docs
        # configuration module that release-please stamped through its
        # extra-release-file declaration.
        #
        # The third entry LEFT on 2026-08-18 (DESIGN-DECISIONS entry 87): the
        # docs configuration module reads its version from the installed
        # distribution metadata now, the extra-release-file declaration is
        # deleted, and a generated release pull request therefore touches no
        # documentation input. It is no longer a release artefact, so it is no
        # longer on this list.
        #
        # This is the ONLY place the allowlist is written down, and it is
        # RECONCILED rather than hand-maintained: assertion A4 in
        # .github/scripts/check_ci_config.py DERIVES the expected set from
        # release-please-config.json -- the changelog path plus every declared
        # extra release file, plus the manifest path -- and fails the build with
        # a named reason on any divergence. With no extra release files declared
        # that derived set has exactly TWO members, which is what this string
        # must set-equal. Re-adding an extra release file re-expands both sides
        # together or the build goes red; it never silently disables this fast
        # path.
        ALLOW='CHANGELOG.md .release-please-manifest.json'

        # Deterministic sink for the changed-path call's standard error (D-A a).
        # A fixed path rather than `mktemp` on purpose: mktemp would be a second
        # command whose own failure needs handling under `set -u` with no
        # errexit, and the whole point of this step is that it never aborts.
        STDERR_FILE="${RUNNER_TEMP:-/tmp}/classify-changes-stderr.$$"

        # Every emission writes its reason to the log next to the value, so a run
        # log answers "why did the fast path not engage" without a re-run.
        emit() {
          echo "release-artifacts-only=$1" >> "$GITHUB_OUTPUT"
          echo "classify-changes: $1 — $2"
        }

        # `emit` states an answer this step KNOWS. The helper below states that
        # the answer could NOT be determined: the fast path is inert and the full
        # suite runs. Only the three "could not find out" branches route through
        # it -- the API call failed, the list came back empty, or the documented
        # file cap was reached. The non-pull_request branch and the
        # not-a-release-artifact branch both KNOW the answer is false and stay on
        # plain `emit`: ci.yml triggers on pull_request, push AND schedule and
        # invokes this composite unconditionally, so annotating a known-false
        # branch would raise a warning on every push and every nightly run in
        # BOTH repositories and destroy the signal this exists to create (D-A b).
        emit_unknown() {
          echo "::warning::classify-changes could not determine the changed-path set on runner '${RUNNER_NAME:-unknown}' — $1 — the release-artifact fast path is INERT on this run and the full suite will run"
          emit false "$1"
        }

        if [ "${{ github.event_name }}" != "pull_request" ]; then
          emit false "event ${{ github.event_name }} is not pull_request — there is no PR to classify"
          exit 0
        fi

        # Server-computed changed paths, NOT `git diff`: actions/checkout's default
        # fetch depth is 1, and a shallow diff against a missing merge base emits a
        # partial or empty diff SILENTLY. The REST endpoint has no fetch-depth
        # coupling at all and reproduces exactly the measurement the allowlist
        # above came from.
        if ! FILES=$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[].filename' 2>"$STDERR_FILE"); then
          # Keep the failing call's own words (D-A a). Newlines are collapsed so a
          # multi-line payload cannot forge additional workflow-command lines, and
          # the text is truncated so a runaway message cannot flood the log.
          GH_ERR=''
          if [ -f "$STDERR_FILE" ]; then
            GH_ERR=$(tr '\n' ' ' < "$STDERR_FILE" | cut -c1-500)
          fi
          rm -f "$STDERR_FILE"
          emit_unknown "the changed-path API call failed: ${GH_ERR:-<no stderr captured>}"
          exit 0
        fi
        rm -f "$STDERR_FILE"

        if [ -z "$FILES" ]; then
          emit_unknown "the changed-path list came back empty — anomalous, not 'nothing changed'"
          exit 0
        fi

        COUNT=$(printf '%s\n' "$FILES" | wc -l)
        if [ "$COUNT" -ge 3000 ]; then
          emit_unknown "changed-path list reached the documented 3000-file API cap — untrustworthy"
          exit 0
        fi

        # Membership is EXACT and entry-by-entry, over a real word list -- NOT
        # containment against a concatenated string. The padded-containment test
        # this replaces (`case " $ALLOW " in *" $changed "*`) accepted a SINGLE
        # changed path whose own NAME contained a space, because
        # " CHANGELOG.md .release-please-manifest.json " is literally a substring
        # of " $ALLOW ". Git and the pull-request files API both permit a space in
        # a path, so one pull request adding one such file emitted 'true' and
        # greened every required context having executed nothing -- on a branch
        # whose ruleset requires zero approving reviews. Found by review CR-02 and
        # reproduced by execution, 2026-08-18.
        #
        # The allowlist is split ONCE, with `read -r -a` rather than an unquoted
        # `for entry in $ALLOW`. Both word-split on IFS, but only the unquoted
        # form ALSO performs pathname expansion, which would let a future entry
        # containing a glob metacharacter be rewritten by whatever happens to sit
        # in the runner's working directory. `read -r -a` cannot glob at all.
        # The ALLOW assignment above deliberately keeps its exact shape (and this
        # comment deliberately does not restate it in quotes, so it cannot be
        # mistaken for the assignment):
        # assertion A4 in .github/scripts/check_ci_config.py extracts the
        # allowlist by matching that literal, so turning it into an array literal
        # would make A4 unable to find it.
        IFS=' ' read -r -a ALLOW_ENTRIES <<< "$ALLOW"

        is_allowed() {
          local candidate="$1" entry
          # ALLOW is a non-empty literal above, and A4 fails the build whenever it
          # set-differs from release-please's own configuration, so this array is
          # never empty in a tree that passes `lint`.
          for entry in "${ALLOW_ENTRIES[@]}"; do
            [ "$candidate" = "$entry" ] && return 0
          done
          return 1
        }

        # Order independence is unchanged: this is a per-path loop with an early
        # exit, so permuting the order the API returns files in cannot change the
        # verdict.
        while IFS= read -r changed; do
          [ -z "$changed" ] && continue
          # Rejected BEFORE the membership test and by name. No allowlist entry
          # contains whitespace, so such a path could never be allowed anyway --
          # but saying so explicitly keeps the reason line honest about what was
          # actually seen. This is a KNOWN false, not a could-not-determine: it
          # stays on plain `emit` and raises no warning annotation (D-A b).
          case "$changed" in
            *[[:space:]]*)
              emit false "changed path contains whitespace, which the allowlist cannot represent: $changed"
              exit 0 ;;
          esac
          if ! is_allowed "$changed"; then
            emit false "changed path is not a release artifact: $changed"
            exit 0
          fi
        done <<< "$FILES"

        emit true "all $COUNT changed path(s) are release artifacts"
